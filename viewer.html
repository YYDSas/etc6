<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>查看解析</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#e9ebef;color:#16181d;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding-top:calc(50px + env(safe-area-inset-top))}
@media (prefers-color-scheme:dark){body{background:#0b0d11;color:#e9eaec}}
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;
  height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;
  background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){#bar{background:rgba(22,25,31,.95);border-bottom-color:rgba(255,255,255,.08)}}
#back{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:inherit;font-size:26px;line-height:1;border-radius:10px}
#back:active{background:rgba(128,128,128,.2)}
#ttl{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pg{flex:0 0 auto;font-size:12.5px;color:#6b7280;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){#pg{color:#9aa1ab}}
#dl{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:#2563eb;font-size:17px;border-radius:10px}
#dl:active{background:rgba(37,99,235,.16)}
#wrap{padding:8px 0 40px}
.pg{margin:0 auto 8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);line-height:0}
.pg img{display:block;width:100%;height:auto}
#hint{padding:36px 24px;text-align:center;color:#6b7280;font-size:14px;line-height:1.8}
@media (prefers-color-scheme:dark){#hint{color:#9aa1ab}}
</style>
</head>
<body>
<div id="bar">
  <a id="back" href="index.html" aria-label="返回">‹</a>
  <div id="ttl">加载中…</div>
  <span id="pg"></span>
  <a id="dl" href="#" download aria-label="下载原 PDF">↓</a>
</div>
<div id="wrap"></div>
<div id="hint">正在加载…</div>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var ttl = document.getElementById('ttl');
  var pgEl = document.getElementById('pg');
  var hint = document.getElementById('hint');
  var dl = document.getElementById('dl');

  var f = new URLSearchParams(location.search).get('f');
  if (!f) { hint.textContent = '缺少文件参数，请从列表页进入。'; return; }

  var name = decodeURIComponent(f).split('/').pop().replace(/\.pdf$/i, '');
  ttl.textContent = name;
  document.title = name;
  dl.href = f;

  var dir = f.replace(/\.pdf$/i, '').split('/').map(encodeURIComponent).join('/');

  fetch('pages/manifest.json', { cache: 'force-cache' })
    .then(function (r) { return r.json(); })
    .then(function (m) {
      var n = m[f];
      if (!n) { hint.textContent = '暂时找不到这份解析的图片版本。'; return; }

      var frag = document.createDocumentFragment();
      var imgs = [];
      for (var i = 1; i <= n; i++) {
        var box = document.createElement('div');
        box.className = 'pg';
        box.style.aspectRatio = '1 / 1.414';
        var img = document.createElement('img');
        img.decoding = 'async';
        img.loading = (i <= 2) ? 'eager' : 'lazy';
        img.alt = '第 ' + i + ' 页';
        img.onload = function () { this.parentNode.style.aspectRatio = 'auto'; };
        img.src = 'pages/' + dir + '/' + i + '.webp';
        box.appendChild(img);
        frag.appendChild(box);
        imgs.push(box);
      }
      wrap.appendChild(frag);
      hint.style.display = 'none';

      var ticking = false;
      function upd() {
        var res = 1;
        for (var k = 0; k < imgs.length; k++) {
          if (imgs[k].getBoundingClientRect().top < window.innerHeight * 0.4) res = k + 1;
          else break;
        }
        pgEl.textContent = res + ' / ' + n;
      }
      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () { upd(); ticking = false; });
      }, { passive: true });
      upd();
    })
    .catch(function (e) {
      hint.textContent = '加载失败：' + e.message + '。可点右上角 ↓ 下载原文件。';
    });
})();
</script>
</body>
</html>
